[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fincomp"
version = "0.1.0"
description = "Combine bank and e-wallet statements into one ledger."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "cryptography>=42",  # pypdf needs it to open AES-encrypted statements
]

[project.optional-dependencies]
# openpyxl only builds workbooks for the tests.
dev = ["pytest>=8", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
