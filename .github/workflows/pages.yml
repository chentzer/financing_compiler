name: Test and deploy the website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same Python the website runs in Pyodide: test it first.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[google,dev]"
      - run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Repo Settings > Secrets and variables > Actions > Variables.
          # The live site always uses your real Google Drive (no demo data).
          # Until GOOGLE_CLIENT_ID is set, sign-in explains what's missing.
          VITE_BACKEND: real
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
